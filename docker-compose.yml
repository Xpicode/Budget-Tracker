services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_DB: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # read from .env
    ports:
      - "5434:5432"   # host 5434 -> container 5432 (5432 and 5433 are used by other projects)
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
